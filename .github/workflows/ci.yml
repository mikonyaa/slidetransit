name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned development tool
        run: python -m pip install --disable-pip-version-check uv==0.12.23
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src/slidetransit
      - run: uv run --frozen pytest tests/unit tests/integration tests/package
      - name: Compare real exported fixture canaries
        run: uv run --frozen slidetransit demo --out "${RUNNER_TEMP}/slidetransit-demo" --json --no-open
      - run: uv run --frozen python -m build
      - name: Test final wheel and sdist consumers outside checkout
        run: uv run --frozen python scripts/verify_release.py --dist dist --json-out qa/consumer.json
      - name: Build own portable example and record origin
        run: |
          uv run --frozen python scripts/build_bundle.py --out dist
          uv run --frozen python scripts/build_metadata.py --out qa/build.json
      - name: Preserve verified release bytes
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            qa/*.json
          retention-days: 7
          if-no-files-found: error
